services:
  neo4j:
    image: neo4j:5-community
    container_name: infra-diagram-neo4j
    ports:
      - "7474:7474"  # HTTP browser
      - "7687:7687"  # Bolt
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

  postgres:
    image: postgres:16-alpine
    container_name: infra-diagram-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=infra_diagram
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=infra_diagram
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U infra_diagram"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  neo4j_data:
  neo4j_logs:
  postgres_data: